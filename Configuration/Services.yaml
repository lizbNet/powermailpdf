services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Undkonsorten\Powermailpdf\EventListener\CreateActionBeforeRenderView:
    tags:
      - name: event.listener
        identifier: 'CreateActionBeforeRenderView'

  Undkonsorten\Powermailpdf\Command\CleanupCommand:
    tags:
      - name: console.command
        command: 'powermailpdf:cleanup'
        description: 'Delete generated PDFs older than the given number of days.'
        schedulable: true
